x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  restart: always
  volumes:
    - ./app:/app
  env_file:
    - .env
  environment:
    - DJANGO_SETTINGS_MODULE=core.settings.prod
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: postgres:14
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: always

  web:
    <<: *app
    # uvicorn-воркеры: HTTP + WebSocket (/api/v1/events, /api/v1/staff/events)
    command: sh -c "/entrypoint.sh && gunicorn core.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers ${WEB_WORKERS:-3} --timeout 120 --access-logfile -"
    ports:
      # наружу только через nginx на хосте
      - "127.0.0.1:${WEB_PORT:-8000}:8000"

  worker:
    <<: *app
    command: celery -A core worker -l info --concurrency ${CELERY_CONCURRENCY:-4}

  beat:
    <<: *app
    command: celery -A core beat -l info

volumes:
  postgres_data:
