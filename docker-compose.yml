x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  volumes:
    - ./app:/app
  env_file:
    - .env
  environment:
    - DJANGO_SETTINGS_MODULE=core.settings.dev
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: postgres:14
    env_file:
      - .env
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6389}:6379"

  web:
    <<: *app
    # runserver с daphne в INSTALLED_APPS обслуживает и HTTP, и WebSocket
    command: sh -c "/entrypoint.sh && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "127.0.0.1:${WEB_PORT:-8084}:8000"

  worker:
    <<: *app
    command: celery -A core worker -l info

  beat:
    <<: *app
    command: celery -A core beat -l info

volumes:
  postgres_data:
