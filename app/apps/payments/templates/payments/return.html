{% load static %}<!doctype html><html lang="{{ lang }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ t.title }}</title>
<style>
:root{--bg:#F4F6F1;--card:#fff;--text:#1C2118;--muted:#6B7365;--accent:#3E7A1F;--gold:#C9A45C;--ok:#3E7A1F;--fail:#C2453A}
@media (prefers-color-scheme:dark){:root{--bg:#141712;--card:#1E221B;--text:#EEF1EA;--muted:#9AA394}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
.card{width:100%;max-width:380px;background:var(--card);border-radius:20px;padding:32px 24px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.06)}
.logo{width:96px;height:96px;border-radius:16px;background:#fff}
h1{font-size:22px;margin:20px 0 6px}.ok{color:var(--ok)}.fail{color:var(--fail)}
p{color:var(--muted);margin:0 0 6px;line-height:1.45}.amount{font-size:28px;font-weight:700;margin:14px 0 22px;color:var(--text)}
.btn{display:block;background:var(--accent);color:#fff;text-decoration:none;padding:14px;border-radius:12px;font-weight:600}
.hint{font-size:13px;margin-top:14px}
</style></head><body><div class="card">
<img class="logo" src="{% static 'payments/baytur-logo.png' %}" alt="BAYTUR">
<h1 class="{% if status == 'paid' %}ok{% elif status == 'failed' %}fail{% endif %}">{{ heading }}</h1><p>{{ text }}</p>
<div class="amount">{{ amount }} {{ t.som }}</div>
<a class="btn" href="{{ return_url }}">{{ t.back }}</a>
<p class="hint">{{ t.hint }}</p>
</div>
<script>
try{if(!sessionStorage.getItem('opened-{{ payment_id }}')){sessionStorage.setItem('opened-{{ payment_id }}','1');location.href='{{ return_url }}'}}catch(e){}
{% if status == 'pending' %}setTimeout(function(){location.reload()},3000);{% endif %}
</script></body></html>
