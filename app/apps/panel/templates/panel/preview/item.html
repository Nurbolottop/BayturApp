{% load panel %}
<div class="p-pad" style="padding-top:4px">
  <div class="p-photo" data-p-bg="image" data-p-gallery></div>
  <div style="display:flex;gap:6px;margin:8px 0 0" data-p-dots></div>
  <div style="margin-top:12px" class="stack-s">
    <div class="row wrap"><span class="p-chip" data-p-l10n="tag" data-p-hide-empty></span><span class="p-cash" data-p-cashback></span></div>
    <div class="p-title" data-p-l10n="title" data-p-empty="Название услуги"></div>
    <div class="p-sub" data-p-l10n="meta"></div>
    <div class="row-between" style="margin-top:4px"><span class="p-price"><span data-p-text="price" data-p-format="num"></span>&#8239;сом</span><span class="p-sub" data-p-unit></span></div>
    <div class="p-card stack-s" data-p-features></div>
    <div class="p-sub" style="color:var(--ink);font-size:14px;line-height:1.5" data-p-l10n="description" data-p-paras></div>
    <div class="p-btn" style="margin-top:6px" data-p-cta>Получить кешбек</div>
  </div>
</div>
