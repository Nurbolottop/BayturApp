{% load panel %}
<div class="p-pad stack-s">
  <div class="p-title">Уровни</div>
  {% for r in rows %}
  <div class="tier-card tier-{{ r.tier.pk }}" style="min-height:110px"><div class="shine"></div>
    <div class="row-between"><div><div class="small" style="opacity:.85">от <span data-p-text="{{ r.tier.pk }}-from_points" data-p-format="num"></span> баллов</div>
      <div style="font-size:20px;font-weight:800;letter-spacing:-.4px" data-p-l10n="{{ r.tier.pk }}-name"></div></div>{% medal r.tier.pk 44 %}</div>
    <div class="row wrap" style="gap:4px" data-p-perks="{{ r.tier.pk }}"></div>
  </div>
  {% endfor %}
</div>
