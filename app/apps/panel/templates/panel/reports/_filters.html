{% load panel %}
<form class="filters" method="get" data-autosubmit>
  <div class="field"><label>С</label><input type="date" name="from" value="{{ f.from }}"></div>
  <div class="field"><label>По</label><input type="date" name="to" value="{{ f.to }}"></div>
  <div class="field"><label>Группировка</label><select name="groupBy">{% for v, l in group_by %}<option value="{{ v }}" {% if f.groupBy == v %}selected{% endif %}>{{ l }}</option>{% endfor %}</select></div>
  <div class="field"><label>Раздел</label><select name="category"><option value="">Все</option>{% for c in categories %}<option value="{{ c.pk }}" {% if f.category == c.pk %}selected{% endif %}>{{ c.title|tr }}</option>{% endfor %}</select></div>
  <div class="field"><label>Точка</label><select name="outlet"><option value="">Все</option>{% for o in outlets %}<option value="{{ o.pk }}" {% if f.outlet == o.pk %}selected{% endif %}>{{ o.name|tr }}</option>{% endfor %}</select></div>
  <div class="field"><label>Уровень</label><select name="tier"><option value="">Все</option>{% for v, l in tiers %}<option value="{{ v }}" {% if f.tier == v %}selected{% endif %}>{{ l }}</option>{% endfor %}</select></div>
  <div class="field"><label>Язык</label><select name="language"><option value="">Все</option>{% for v, l in languages %}<option value="{{ v }}" {% if f.language == v %}selected{% endif %}>{{ l }}</option>{% endfor %}</select></div>
  <div class="field"><label>Платформа</label><select name="platform"><option value="">Все</option>{% for v, l in platforms %}<option value="{{ v }}" {% if f.platform == v %}selected{% endif %}>{{ l }}</option>{% endfor %}</select></div>
  <a class="btn btn-ghost" href="?">Сбросить</a>
</form>
