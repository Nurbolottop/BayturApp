<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>{{ title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--accent:#C6F24E;--ink:#12140F;--muted:rgba(18,20,15,.6);--page:#F4F6F1;--surface:#fff;--line:rgba(18,20,15,.08)}
@media (prefers-color-scheme:dark){:root{--ink:#F1F3EE;--muted:rgba(241,243,238,.6);--page:#0D0E0C;--surface:#191B17;--line:rgba(241,243,238,.1)}}
*{box-sizing:border-box}body{margin:0;font-family:Onest,system-ui,sans-serif;background:var(--page);color:var(--ink);padding:16px}
.card{background:var(--surface);border-radius:28px;padding:28px;max-width:900px;margin:0 auto}
.badge{display:inline-block;background:var(--accent);color:#12140F;font-weight:700;font-size:13px;padding:5px 12px;border-radius:999px;margin-bottom:14px}
h1{font-size:30px;font-weight:800;letter-spacing:-.8px;line-height:1.15;margin:0 0 14px}
h2{font-size:22px;font-weight:800;letter-spacing:-.4px;margin:36px 0 10px;padding-top:20px;border-top:1px solid var(--line)}
h3{font-size:17px;font-weight:700;margin:22px 0 8px}
p,li,td,th{font-size:15px;line-height:1.6}p{margin:0 0 12px}
ul,ol{margin:0 0 14px;padding-left:22px}li{margin-bottom:6px}
li.check{list-style:none;margin-left:-22px}li.check input{width:18px;height:18px;vertical-align:-3px;margin-right:6px;accent-color:#7DA82A}
.table{overflow-x:auto;margin:6px 0 16px;border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}
th{font-weight:700;background:var(--line)}tr:last-child td{border-bottom:0}
strong{font-weight:700}
.foot{color:var(--muted);font-size:13px;margin-top:28px}
@media (max-width:600px){.card{padding:20px;border-radius:22px}h1{font-size:25px}}
@media print{body{background:#fff;padding:0}.card{box-shadow:none;padding:0}}
</style>
</head>
<body>
<div class="card">
  <span class="badge">BAYTUR · для отдела маркетинга</span>
  <h1>{{ title }}</h1>
  {{ html }}
  <div class="foot">Обновлено {{ updated|date:"d.m.Y" }}. Галочки в чек-листе — для удобства, они не сохраняются.</div>
</div>
</body>
</html>
