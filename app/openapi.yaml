          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/cashback-requests/quote:
    post:
      operationId: cashback_requests_quote_create
      description: Мобилка вызывает на каждое изменение ввода (с задержкой ~300 мс).
      summary: Расчёт оплаты и кешбека (на каждое изменение ввода)
      parameters:
      - in: header
        name: Accept-Language
        schema:
          type: string
          enum:
          - en
          - ky
          - ru
        description: Язык контента, fallback ru
      - in: header
        name: X-Device-Id
        schema:
          type: string
        description: Анонимный UUID установки (для аналитики и rate limit)
      tags:
      - Заявки
      requestBody:
        content:
