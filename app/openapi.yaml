        description: Язык контента, fallback ru
      - in: header
        name: X-Device-Id
        schema:
          type: string
        description: Анонимный UUID установки (для аналитики и rate limit)
      tags:
      - Вход
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
