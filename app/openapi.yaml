      type: object
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/RequestStatus'
        createdAt:
          type: string
          format: date-time
        timeline:
          type: object
          additionalProperties:
            type: string
            format: date-time
          description: status → datetime (+ adjusted)
        item:
          $ref: '#/components/schemas/ItemSnapshot'
        quantity:
          type: integer
        checkAmount:
          type: integer
          nullable: true
        rules:
          $ref: '#/components/schemas/CashbackRules'
        split:
          $ref: '#/components/schemas/PaymentSplit'
        method:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/PaymentMethod'
          - $ref: '#/components/schemas/NullEnum'
        receipt:
          allOf:
          - $ref: '#/components/schemas/Receipt'
          nullable: true
        originalTotal:
          type: integer
          nullable: true
        rejectReason:
          type: string
          nullable: true
        adjustReason:
          type: string
          nullable: true
