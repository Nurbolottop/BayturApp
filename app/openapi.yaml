          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/cashback-requests:
    get:
      operationId: cashback_requests_list
      description: 'Личные эндпоинты: без токена → 401 auth_required.'
      summary: Заявки
      parameters:
      - in: header
        name: Accept-Language
        schema:
          type: string
          enum:
          - en
          - ky
          - ru
        description: Язык контента, fallback ru
      - in: header
        name: X-Device-Id
        schema:
          type: string
        description: Анонимный UUID установки (для аналитики и rate limit)
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: limit
        schema:
          type: integer
        description: По умолчанию 20
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - all
      tags:
      - Заявки
      security:
      - memberBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestsPage'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    post:
      operationId: cashback_requests_create
      description: 'Личные эндпоинты: без токена → 401 auth_required.'
      summary: Создать заявку (сервер пересчитывает всё сам)
      parameters:
      - in: header
        name: Accept-Language
        schema:
          type: string
          enum:
          - en
          - ky
          - ru
        description: Язык контента, fallback ru
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Повтор с тем же ключом не создаёт вторую заявку
      - in: header
        name: X-Device-Id
        schema:
          type: string
        description: Анонимный UUID установки (для аналитики и rate limit)
      tags:
      - Заявки
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RequestInputRequest'
        required: true
      security:
      - memberBearer: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashbackRequest'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/cashback-requests/{request_id}:
    get:
      operationId: cashback_requests_retrieve
      description: 'Личные эндпоинты: без токена → 401 auth_required.'
      summary: Заявка
      parameters:
      - in: header
        name: Accept-Language
        schema:
          type: string
          enum:
          - en
          - ky
          - ru
        description: Язык контента, fallback ru
      - in: header
        name: X-Device-Id
        schema:
          type: string
        description: Анонимный UUID установки (для аналитики и rate limit)
      - in: path
        name: request_id
        schema:
          type: string
        required: true
      tags:
      - Заявки
      security:
      - memberBearer: []
      responses:
        '200':
          content:
            application/json:
