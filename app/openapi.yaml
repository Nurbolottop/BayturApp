      properties:
        required:
          type: boolean
          description: true только при reason = check
        reason:
          allOf:
          - $ref: '#/components/schemas/TierRetentionReasonEnum'
          description: |-
            check — в конце года проверка; floor — уровень вечный; new_this_period — получен в этом году, проверки не будет; not_required — без подтверждения

            * `check` - check
            * `floor` - floor
            * `new_this_period` - new_this_period
            * `not_required` - not_required
        periodEnd:
          type: string
          format: date-time
          nullable: true
        limit:
          type: integer
          description: только при reason = check
        collected:
          type: integer
        left:
          type: integer
        progress:
          type: number
          format: double
        atRisk:
          type: boolean
          description: до конца периода меньше atRiskDays и лимит не собран
        dropTo:
          type: string
          description: на какой уровень упадёт, если не подтвердить
        achievements:
          $ref: '#/components/schemas/AchievementCount'
      required:
      - periodEnd
      - reason
      - required
    TierRetentionReasonEnum:
      enum:
      - check
      - floor
      - new_this_period
      - not_required
      type: string
      description: |-
        * `check` - check
        * `floor` - floor
        * `new_this_period` - new_this_period
        * `not_required` - not_required
    TierState:
      type: object
      properties:
        id:
          type: string
          description: id уровня из GET /loyalty/program (набор уровней задаётся в
            админке)
        since:
          type: string
          format: date-time
        floor:
          type: string
          nullable: true
          description: 'вечный уровень: ниже него клиент не упадёт'
        isFloor:
          type: boolean
        maxReached:
          type: string
        next:
          allOf:
          - $ref: '#/components/schemas/TierNext'
          nullable: true
          description: null на высшем уровне
        retention:
          $ref: '#/components/schemas/TierRetention'
      required:
      - floor
      - id
      - isFloor
      - maxReached
      - next
      - retention
      - since
    TierStyle:
      type: object
      properties:
        gradient:
          type: array
          items:
            type: string
          description: '3 цвета #RRGGBB (тёмный → светлый)'
        glow:
          type: string
          description: 'цвет свечения #RRGGBB'
        medalUrl:
          type: string
          format: uri
          nullable: true
          description: null — рисовать стандартную медаль в цветах gradient
        icon:
          type: string
          nullable: true
      required:
      - glow
      - gradient
      - icon
      - medalUrl
    Tokens:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
      required:
      - accessToken
      - expiresIn
      - refreshToken
    TokensWithProfile:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
        profile:
          $ref: '#/components/schemas/Profile'
      required:
      - accessToken
      - expiresIn
      - profile
      - refreshToken
    Uploaded:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
      required:
      - id
      - url
    UsageEnum:
      enum:
      - entry
      - retention
      - both
      type: string
      description: |-
        * `entry` - entry
        * `retention` - retention
        * `both` - both
    Wallet:
      type: object
      properties:
        available:
          type: integer
          description: можно потратить сейчас (резерв уже вычтен) — крупно на карте
            баланса
        reserved:
          type: integer
        current:
          type: integer
          description: '«Нынешние»: решают уровень, обнуляются при повышении и 1 января'
        lifetime:
          type: integer
          description: '«За всё время»: только в Профиль → Настройки'
        pendingCashback:
          type: integer
        tier:
          $ref: '#/components/schemas/TierState'
        period:
          $ref: '#/components/schemas/Period'
        balance:
          type: integer
          description: 'устарело: available + reserved'
        nextTier:
          type: string
          nullable: true
          description: 'устарело: = tier.next.id'
        leftToNext:
          type: integer
          description: 'устарело: = tier.next.left'
        progress:
          type: number
          format: double
          description: 'устарело: = tier.next.progress'
      required:
      - available
      - balance
      - current
      - leftToNext
      - lifetime
      - nextTier
      - pendingCashback
      - period
      - progress
      - reserved
      - tier
    WebhookOk:
      type: object
      properties:
        ok:
          type: boolean
      required:
      - ok
  securitySchemes:
    memberBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    memberBearerOptional:
      type: http
      scheme: bearer
      bearerFormat: JWT
    staffBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
