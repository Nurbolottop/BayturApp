  /api/v1/cashback-requests/{request_id}/cancel:
    post:
      operationId: cashback_requests_cancel_create
      description: 'Личные эндпоинты: без токена → 401 auth_required.'
      summary: Отменить заявку (только pending)
      parameters:
      - in: header
        name: Accept-Language
        schema:
          type: string
          enum:
          - en
          - ky
          - ru
        description: Язык контента, fallback ru
      - in: header
        name: X-Device-Id
        schema:
          type: string
        description: Анонимный UUID установки (для аналитики и rate limit)
      - in: path
