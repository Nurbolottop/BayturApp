components:
  schemas:
    Achievement:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        scope:
          allOf:
          - $ref: '#/components/schemas/ScopeEnum'
          description: |-
            за всё время / за текущий период (год)

            * `lifetime` - lifetime
            * `period` - period
      required:
      - description
      - icon
      - id
      - scope
      - title
    AchievementCount:
      type: object
      properties:
        required:
          type: integer
        done:
          type: integer
      required:
      - done
      - required
    AchievementProgress:
      type: object
      properties:
        id:
          type: string
        progress:
          type: integer
        target:
          type: integer
        completedAt:
          type: string
          format: date-time
          nullable: true
        periodKey:
          type: string
          nullable: true
          description: для заданий «за период»
      required:
      - completedAt
      - id
      - periodKey
      - progress
      - target
    Achievements:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AchievementProgress'
      required:
      - items
    AdjustInputRequest:
      type: object
      properties:
        total:
          type: integer
        reason:
          type: string
          minLength: 1
      required:
      - reason
      - total
    AdjustPreview:
      type: object
      properties:
        total:
          type: integer
        pointsSom:
          type: integer
        points:
          type: integer
        moneySom:
          type: integer
        rate:
          type: number
          format: double
        cashback:
          type: integer
        maxPointsSom:
          type: integer
        needsManager:
          type: boolean
      required:
      - cashback
      - maxPointsSom
      - moneySom
      - needsManager
      - points
      - pointsSom
      - rate
      - total
    AdjustPreviewInputRequest:
      type: object
      properties:
        total:
          type: integer
      required:
      - total
    AppConfig:
      type: object
      properties:
        minVersion:
          type: object
          additionalProperties:
            type: string
        updateRequired:
          type: boolean
        maintenance:
          type: boolean
        maintenanceMessage:
          type: string
          nullable: true
      required:
      - maintenance
      - maintenanceMessage
      - minVersion
      - updateRequired
    AppEventInputRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        at:
          type: string
          format: date-time
        props:
          type: object
          additionalProperties: {}
      required:
      - at
      - name
    AppleLoginRequest:
      type: object
      properties:
        identityToken:
          type: string
          minLength: 1
          description: identityToken из Sign in with Apple
        authorizationCode:
          type: string
          minLength: 1
          description: Нужен, чтобы отозвать доступ при удалении аккаунта
        nonce:
          type: string
          minLength: 1
          description: Исходный nonce, если передавался в запрос к Apple
        firstName:
          type: string
          minLength: 1
          description: Apple отдаёт имя только при первом входе
        lastName:
          type: string
          minLength: 1
      required:
      - identityToken
    Article:
      type: object
      properties:
        id:
          type: string
        image:
          type: string
          format: uri
          nullable: true
        tag:
          type: string
        title:
          type: string
        lead:
          type: string
        body:
          type: array
          items:
            type: string
        quote:
          type: string
          nullable: true
        date:
          type: string
          format: date
        minutes:
          type: integer
        category:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/CategoryId'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - body
      - category
      - date
      - id
      - image
      - lead
      - minutes
      - quote
      - tag
      - title
    AvatarUploadRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
      required:
      - file
    Bonus:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/BonusKind'
        title:
          type: string
          nullable: true
        multiplier:
          type: number
          format: double
      required:
      - kind
    BonusKind:
      enum:
      - promo
      - birthday
      type: string
      description: |-
        * `promo` - promo
        * `birthday` - birthday
    CashbackRequest:
      type: object
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/RequestStatus'
        createdAt:
          type: string
          format: date-time
        timeline:
          type: object
          additionalProperties:
            type: string
            format: date-time
          description: status → datetime (+ adjusted)
        item:
          $ref: '#/components/schemas/ItemSnapshot'
        quantity:
          type: integer
        checkAmount:
          type: integer
          nullable: true
        rules:
          $ref: '#/components/schemas/CashbackRules'
        split:
          $ref: '#/components/schemas/PaymentSplit'
        method:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/PaymentMethod'
          - $ref: '#/components/schemas/NullEnum'
        receipt:
          allOf:
          - $ref: '#/components/schemas/Receipt'
          nullable: true
        originalTotal:
          type: integer
          nullable: true
        rejectReason:
          type: string
          nullable: true
        adjustReason:
          type: string
          nullable: true
        bonuses:
          type: array
          items:
            $ref: '#/components/schemas/Bonus'
      required:
      - adjustReason
      - bonuses
      - checkAmount
      - createdAt
      - id
      - item
      - method
      - originalTotal
      - quantity
      - receipt
      - rejectReason
      - rules
      - split
      - status
      - timeline
    CashbackRules:
      type: object
      properties:
        rate:
          type: number
          format: double
        maxPointsShare:
          type: number
          format: double
        methods:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethod'
      required:
      - maxPointsShare
      - methods
      - rate
    CategoryId:
      enum:
      - rooms
      - spa
      - food
      - pools
      - sport
      type: string
      description: |-
        * `rooms` - Номера
        * `spa` - SPA
        * `food` - Рестораны
        * `pools` - Бассейны
        * `sport` - Спорт
    CauseEnum:
      enum:
      - promotion
      - period_drop
      - admin
      - migration
      type: string
      description: |-
        * `promotion` - promotion
        * `period_drop` - period_drop
        * `admin` - admin
        * `migration` - migration
    Complaint:
      type: object
      properties:
        id:
          type: string
        number:
          type: string
        category:
          type: string
        categoryTitle:
          type: string
        subtype:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ComplaintSubtype'
          - $ref: '#/components/schemas/NullEnum'
        outletId:
          type: string
          nullable: true
        requestId:
          type: string
          nullable: true
        operationId:
          type: string
          nullable: true
