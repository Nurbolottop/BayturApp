components:
  schemas:
    AdjustInputRequest:
      type: object
      properties:
        total:
          type: integer
        reason:
          type: string
          minLength: 1
      required:
      - reason
      - total
    AdjustPreview:
      type: object
      properties:
        total:
          type: integer
        pointsSom:
          type: integer
        points:
          type: integer
        moneySom:
          type: integer
        rate:
          type: number
          format: double
        cashback:
          type: integer
        maxPointsSom:
          type: integer
        needsManager:
          type: boolean
      required:
      - cashback
      - maxPointsSom
      - moneySom
      - needsManager
      - points
      - pointsSom
      - rate
      - total
    AdjustPreviewInputRequest:
      type: object
      properties:
        total:
          type: integer
      required:
      - total
    AppConfig:
      type: object
      properties:
        minVersion:
          type: object
          additionalProperties:
            type: string
        updateRequired:
          type: boolean
        maintenance:
          type: boolean
        maintenanceMessage:
          type: string
          nullable: true
      required:
      - maintenance
      - maintenanceMessage
      - minVersion
      - updateRequired
    AppEventInputRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        at:
          type: string
          format: date-time
        props:
          type: object
          additionalProperties: {}
      required:
      - at
      - name
    Article:
      type: object
      properties:
        id:
          type: string
        image:
          type: string
          format: uri
          nullable: true
        tag:
          type: string
        title:
          type: string
        lead:
          type: string
        body:
          type: array
          items:
            type: string
        quote:
          type: string
          nullable: true
        date:
          type: string
          format: date
        minutes:
          type: integer
        category:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/CategoryId'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - body
      - category
      - date
      - id
      - image
      - lead
      - minutes
      - quote
      - tag
      - title
    Bonus:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/BonusKind'
        title:
          type: string
          nullable: true
        multiplier:
          type: number
          format: double
      required:
      - kind
    BonusKind:
      enum:
      - promo
      - birthday
      type: string
      description: |-
        * `promo` - promo
        * `birthday` - birthday
