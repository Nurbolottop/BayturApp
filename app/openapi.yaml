        required: true
      security:
      - memberBearerOptional: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokensWithProfile'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/restart:
    post:
      operationId: auth_restart_create
      description: '«Начать заново» вместо восстановления: старый аккаунт стирается,
        дальше регистрация.'
      summary: '«Начать заново»: стереть старый аккаунт и зарегистрироваться'
      parameters:
      - in: header
        name: Accept-Language
        schema:
          type: string
          enum:
          - en
          - ky
          - ru
        description: Язык контента, fallback ru
      - in: header
        name: X-Device-Id
        schema:
          type: string
        description: Анонимный UUID установки (для аналитики и rate limit)
      tags:
      - Вход
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestartInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RestartInputRequest'
        required: true
      security:
      - memberBearerOptional: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestartOutput'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/restore:
    post:
      operationId: auth_restore_create
      description: Без токена; с токеном отвечает так же (один кеш для всех). Rate
        limit по IP и X-Device-Id.
      summary: Восстановить удалённый аккаунт (30 дней)
      parameters:
      - in: header
        name: Accept-Language
        schema:
          type: string
          enum:
          - en
          - ky
          - ru
        description: Язык контента, fallback ru
      - in: header
        name: X-Device-Id
        schema:
