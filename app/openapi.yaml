openapi: 3.0.3
info:
  title: BAYTUR API
  version: 1.0.0
  description: 'Backend программы лояльности BAYTUR: клиентский API, рабочее место
    сотрудника и админ-API.'
paths:
  /api/v1/admin/auth/2fa:
    post:
      operationId: admin_auth_2fa_create
      summary: TOTP-код → токены
      parameters:
      - in: header
        name: Accept-Language
        schema:
          type: string
          enum:
          - en
          - ky
          - ru
        description: Язык контента, fallback ru
      - in: header
        name: X-Device-Id
        schema:
          type: string
        description: Анонимный UUID установки (для аналитики и rate limit)
      tags:
      - 'Админка: вход'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffTwoFactorRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StaffTwoFactorRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/admin/auth/login:
    post:
      operationId: admin_auth_login_create
      summary: Email + пароль → токен второго шага
      parameters:
      - in: header
        name: Accept-Language
        schema:
          type: string
          enum:
          - en
          - ky
          - ru
        description: Язык контента, fallback ru
      - in: header
        name: X-Device-Id
        schema:
          type: string
        description: Анонимный UUID установки (для аналитики и rate limit)
      tags:
      - 'Админка: вход'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StaffLoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffLoginStep'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/admin/auth/logout:
    post:
      operationId: admin_auth_logout_create
      summary: Выход сотрудника
      parameters:
      - in: header
        name: Accept-Language
        schema:
          type: string
          enum:
          - en
          - ky
          - ru
        description: Язык контента, fallback ru
      - in: header
        name: X-Device-Id
        schema:
          type: string
        description: Анонимный UUID установки (для аналитики и rate limit)
      tags:
      - 'Админка: вход'
      security:
      - staffBearer: []
      responses:
        '204':
          description: Без тела
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/admin/auth/refresh:
    post:
      operationId: admin_auth_refresh_create
      summary: Обновить токены сотрудника
      parameters:
      - in: header
        name: Accept-Language
        schema:
          type: string
          enum:
          - en
          - ky
          - ru
        description: Язык контента, fallback ru
      - in: header
        name: X-Device-Id
        schema:
          type: string
        description: Анонимный UUID установки (для аналитики и rate limit)
      tags:
      - 'Админка: вход'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StaffRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/admin/me:
    get:
      operationId: admin_me_retrieve
      summary: Профиль и права сотрудника
      parameters:
      - in: header
        name: Accept-Language
        schema:
          type: string
          enum:
          - en
          - ky
          - ru
        description: Язык контента, fallback ru
      - in: header
        name: X-Device-Id
        schema:
          type: string
        description: Анонимный UUID установки (для аналитики и rate limit)
      tags:
      - 'Админка: вход'
      security:
      - staffBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffProfile'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/admin/me/password:
    post:
      operationId: admin_me_password_create
      description: Смена пароля (обязательна после выдачи временного).
      summary: Сменить пароль (обязательно после временного)
      parameters:
      - in: header
        name: Accept-Language
        schema:
          type: string
          enum:
          - en
          - ky
          - ru
        description: Язык контента, fallback ru
      - in: header
        name: X-Device-Id
        schema:
          type: string
        description: Анонимный UUID установки (для аналитики и rate limit)
      tags:
      - 'Админка: вход'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StaffPasswordRequest'
        required: true
      security:
      - staffBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffProfileAfterPassword'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/app/config:
    get:
      operationId: app_config_retrieve
      description: Минимальная версия приложения (принудительное обновление) и техработы.
      summary: Минимальная версия приложения и техработы
      parameters:
      - in: header
        name: Accept-Language
        schema:
          type: string
          enum:
          - en
          - ky
          - ru
        description: Язык контента, fallback ru
      - in: header
        name: X-App-Version
        schema:
          type: string
      - in: header
        name: X-Device-Id
        schema:
          type: string
        description: Анонимный UUID установки (для аналитики и rate limit)
      - in: header
        name: X-Platform
        schema:
          type: string
          enum:
          - android
          - ios
      tags:
      - Служебное
      security:
      - memberBearerOptional: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfig'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      description: 'Личные эндпоинты: без токена → 401 auth_required.'
      summary: 'Выход: отзыв refresh и отвязка push-токена'
      parameters:
      - in: header
        name: Accept-Language
        schema:
          type: string
          enum:
          - en
          - ky
          - ru
        description: Язык контента, fallback ru
      - in: header
        name: X-Device-Id
        schema:
          type: string
        description: Анонимный UUID установки (для аналитики и rate limit)
      tags:
      - Вход
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutInputRequest'
      security:
      - memberBearer: []
      responses:
        '204':
          description: Без тела
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/otp/request:
    post:
      operationId: auth_otp_request_create
      description: Без токена; с токеном отвечает так же (один кеш для всех). Rate
        limit по IP и X-Device-Id.
      summary: Запросить SMS-код
      parameters:
      - in: header
        name: Accept-Language
        schema:
          type: string
          enum:
          - en
          - ky
          - ru
        description: Язык контента, fallback ru
      - in: header
        name: X-Device-Id
        schema:
          type: string
        description: Анонимный UUID установки (для аналитики и rate limit)
      tags:
      - Вход
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
        required: true
      security:
      - memberBearerOptional: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequested'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/otp/verify:
    post:
      operationId: auth_otp_verify_create
      description: Без токена; с токеном отвечает так же (один кеш для всех). Rate
        limit по IP и X-Device-Id.
      summary: 'Проверить код: токены | регистрация | восстановление'
      parameters:
      - in: header
        name: Accept-Language
        schema:
          type: string
          enum:
          - en
          - ky
          - ru
        description: Язык контента, fallback ru
      - in: header
        name: X-Device-Id
        schema:
          type: string
        description: Анонимный UUID установки (для аналитики и rate limit)
      tags:
      - Вход
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
        required: true
      security:
      - memberBearerOptional: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerified'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/refresh:
    post:
      operationId: auth_refresh_create
      description: Без токена; с токеном отвечает так же (один кеш для всех). Rate
        limit по IP и X-Device-Id.
      summary: Обновить пару токенов (ротация)
      parameters:
      - in: header
        name: Accept-Language
        schema:
          type: string
          enum:
          - en
          - ky
          - ru
        description: Язык контента, fallback ru
      - in: header
        name: X-Device-Id
        schema:
          type: string
        description: Анонимный UUID установки (для аналитики и rate limit)
      tags:
      - Вход
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshInputRequest'
        required: true
      security:
      - memberBearerOptional: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/register:
    post:
      operationId: auth_register_create
      description: Без токена; с токеном отвечает так же (один кеш для всех). Rate
        limit по IP и X-Device-Id.
      summary: Регистрация нового участника
      parameters:
      - in: header
        name: Accept-Language
        schema:
          type: string
          enum:
          - en
          - ky
