        * `platinum` - Платина
        * `diamond` - Бриллиант
    Tokens:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
      required:
      - accessToken
      - expiresIn
      - refreshToken
    TokensWithProfile:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
        profile:
          $ref: '#/components/schemas/Profile'
      required:
      - accessToken
      - expiresIn
      - profile
      - refreshToken
    Uploaded:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
      required:
      - id
      - url
    Wallet:
      type: object
      properties:
        balance:
          type: integer
        reserved:
          type: integer
        available:
          type: integer
        lifetime:
          type: integer
        tier:
          $ref: '#/components/schemas/TierId'
        pendingCashback:
          type: integer
        nextTier:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/TierId'
          - $ref: '#/components/schemas/NullEnum'
        leftToNext:
          type: integer
        progress:
          type: number
          format: double
        expiresAt:
          type: string
          format: date-time
          nullable: true
      required:
      - available
      - balance
      - expiresAt
      - leftToNext
      - lifetime
      - nextTier
      - pendingCashback
      - progress
      - reserved
      - tier
    WebhookOk:
      type: object
      properties:
        ok:
          type: boolean
      required:
      - ok
