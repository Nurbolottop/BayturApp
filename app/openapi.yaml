openapi: 3.0.3
info:
  title: BAYTUR API
  version: 1.0.0
  description: 'Backend программы лояльности BAYTUR: клиентский API, рабочее место
    сотрудника и админ-API.'
paths:
  /api/v1/admin/auth/2fa:
    post:
      operationId: admin_auth_2fa_create
      summary: TOTP-код → токены
      parameters:
      - in: header
        name: Accept-Language
        schema:
          type: string
          enum:
          - en
          - ky
          - ru
        description: Язык контента, fallback ru
      - in: header
        name: X-Device-Id
        schema:
          type: string
        description: Анонимный UUID установки (для аналитики и rate limit)
      tags:
      - 'Админка: вход'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffTwoFactorRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StaffTwoFactorRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/admin/auth/login:
    post:
      operationId: admin_auth_login_create
      summary: Email + пароль → токен второго шага
      parameters:
